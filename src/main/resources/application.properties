spring.application.name=demo-ai-or-die-softwareentwicklung

# --- Datasource (H2 in-memory) ---
# In-memory H2 database. Data is recreated on every start (demo setup).
spring.datasource.url=jdbc:h2:mem:taa;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# Schema is owned by Flyway, so Hibernate must not auto-create/update it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Localization (German product, consistent messages & date formatting) ---
spring.web.locale=de_DE
spring.web.locale-resolver=fixed
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Session hardening ---
# Wizard state lives in the session; harden the cookie and cap the lifetime.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Only track the session via cookie (never expose the session id in the URL).
server.servlet.session.tracking-modes=cookie

# --- Error handling ---
# Render our DEVK-styled error page; never leak stacktraces to clients.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
