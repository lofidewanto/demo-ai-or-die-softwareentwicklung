spring.application.name=demo-ai-or-die-softwareentwicklung

# --- Datasource (H2 in-memory) ---
# In-memory H2 database. Data is recreated on every start (demo setup).
spring.datasource.url=jdbc:h2:mem:taa;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# Schema is owned by Flyway, so Hibernate must not auto-create/update it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- H2 web console (handy for local development) ---
# Available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
